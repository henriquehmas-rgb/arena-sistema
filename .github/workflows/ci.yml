name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arena
          POSTGRES_PASSWORD: arena
          POSTGRES_DB: arena
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arena"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://arena:arena@localhost:5432/arena
      TEST_DATABASE_URL: postgresql+asyncpg://arena:arena@localhost:5432/arena
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -e backend[dev]

      - name: Lint (ruff)
        run: ruff check backend

      - name: Run migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Run tests
        run: pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  e2e:
    # Task T15: roda a stack completa (backend uvicorn + frontend next dev,
    # sem Docker) contra Postgres/Redis efêmeros do próprio Actions e
    # executa os specs Playwright (e2e/*.spec.ts).
    #
    # Histórico do continue-on-error: true nesta job (removido — todos os
    # bugs abaixo já foram corrigidos e confirmados com os specs passando
    # no CI de verdade, banco efêmero limpo):
    #   1. Bugs originais da T15 (MissingGreenlet em `_para_out`, mismatch de
    #      contrato {itens,total} em GET /reservas) — corrigidos em commits
    #      posteriores à T15.
    #   2. 2 bugs de infraestrutura do próprio job (não da app): (a) `wait-on`
    #      manda HEAD por padrão e `GET /api/v1/health` só aceita GET -> 405
    #      infinito -> timeout mesmo com o backend saudável; corrigido usando
    #      o esquema `http-get://`. (b) `playwright.config.ts` tinha `baseURL`
    #      fixo em `localhost:3900` (workaround só de uma máquina de dev
    #      local), mas o CI sobe o `next dev` na porta padrão 3000 ->
    #      ERR_CONNECTION_REFUSED; corrigido lendo `PLAYWRIGHT_BASE_URL` com
    #      fallback pra 3000.
    #   3. Bug real de produção capturado pelo admin.spec.ts só depois de (1)
    #      e (2) corrigidos (antes o spec nunca chegava a rodar de verdade):
    #      o modal "Bloquear horário" (`frontend/components/AgendaAdmin.tsx`,
    #      `ModalBloqueio.confirmar`) montava `inicio`/`fim` como
    #      `${data}T${horaInicio}:00` — datetime SEM timezone. O backend
    #      guardava isso interpretado conforme o timezone da SESSÃO do
    #      Postgres (não necessariamente America/Cuiaba, como no Postgres
    #      efêmero do CI, que é UTC por padrão) — um bloqueio criado às
    #      "08:00" no modal podia salvar deslocado do horário pretendido
    #      pelo staff, dependendo de como o Postgres do ambiente estivesse
    #      configurado. Corrigido convertendo local->UTC explicitamente no
    #      frontend (`lib/format.ts#localParaUTC`), independente de
    #      configuração de timezone do servidor.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arena
          POSTGRES_PASSWORD: arena
          POSTGRES_DB: arena
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arena"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://arena:arena@localhost:5432/arena
      REDIS_URL: redis://localhost:6379/0
      PAGARME_MODE: simulado
      FRONTEND_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -e backend[dev]

      - name: Run migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Seed dados iniciais
        working-directory: backend
        run: python -m app.seed

      - name: Start backend (uvicorn)
        working-directory: backend
        run: nohup python -m uvicorn app.main:app --port 8000 > /tmp/backend.log 2>&1 &

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright (chromium)
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start frontend (next dev)
        working-directory: frontend
        run: nohup npm run dev > /tmp/frontend.log 2>&1 &

      - name: Wait for backend + frontend
        # `http-get://` (não `http://`) é de propósito: por padrão o wait-on
        # manda HEAD, e `GET /api/v1/health` não implementa HEAD — respondia
        # 405 pra sempre, então o wait-on nunca via um 2xx e estourava o
        # timeout mesmo com o backend já de pé e saudável (confirmado via
        # /tmp/backend.log num run de diagnóstico: "Application startup
        # complete" seguido só de 405s).
        run: |
          npx --yes wait-on http-get://localhost:8000/api/v1/health http://localhost:3000 --timeout 60000

      - name: Dump backend/frontend logs (diagnóstico)
        if: failure()
        run: |
          echo "--- backend.log ---"; cat /tmp/backend.log || true
          echo "--- frontend.log ---"; cat /tmp/frontend.log || true

      - name: Run Playwright E2E
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
