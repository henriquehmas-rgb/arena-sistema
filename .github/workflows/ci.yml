name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arena
          POSTGRES_PASSWORD: arena
          POSTGRES_DB: arena
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arena"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://arena:arena@localhost:5432/arena
      TEST_DATABASE_URL: postgresql+asyncpg://arena:arena@localhost:5432/arena
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -e backend[dev]

      - name: Lint (ruff)
        run: ruff check backend

      - name: Run migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Run tests
        run: pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  e2e:
    # Task T15: roda a stack completa (backend uvicorn + frontend next dev,
    # sem Docker) contra Postgres/Redis efêmeros do próprio Actions e
    # executa os specs Playwright (e2e/*.spec.ts). Era `continue-on-error:
    # true` porque os specs reproduziam 2 bugs reais da aplicação
    # (MissingGreenlet em `_para_out` ao criar reserva, e mismatch de
    # contrato em `GET /reservas` staff — ver .git/sdd/task-15-report.md).
    # Ambos já foram corrigidos em commits posteriores (`Reserva.recurso`
    # agora é `lazy="joined"`; `lib/api.ts`/`AgendaAdmin`/`admin/reservas`
    # já leem `.itens`) — confirmado rodando os specs localmente (2 passed)
    # antes de remover a flag, então o job volta a ser bloqueante de verdade.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arena
          POSTGRES_PASSWORD: arena
          POSTGRES_DB: arena
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arena"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://arena:arena@localhost:5432/arena
      REDIS_URL: redis://localhost:6379/0
      PAGARME_MODE: simulado
      FRONTEND_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -e backend[dev]

      - name: Run migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Seed dados iniciais
        working-directory: backend
        run: python -m app.seed

      - name: Start backend (uvicorn)
        working-directory: backend
        run: nohup python -m uvicorn app.main:app --port 8000 > /tmp/backend.log 2>&1 &

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright (chromium)
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start frontend (next dev)
        working-directory: frontend
        run: nohup npm run dev > /tmp/frontend.log 2>&1 &

      - name: Wait for backend + frontend
        run: |
          npx --yes wait-on http://localhost:8000/api/v1/health http://localhost:3000 --timeout 60000

      - name: Run Playwright E2E
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
