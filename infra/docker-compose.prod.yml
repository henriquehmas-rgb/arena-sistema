# Override de produção (VPS compartilhada): remove a publicação de portas no
# host que o compose base usa só como atalho de desenvolvimento.
#
# - postgres/redis nunca devem ficar expostos no host em produção (só a rede
#   interna `app`, consumida pelo serviço `api`).
# - api/web já são expostos publicamente pelo Traefik (labels no compose
#   base); publicar 8000/3000 no host é redundante em produção e colide com
#   portas já usadas por outros projetos nesta VPS.
#
# Achado na revisão final de branch: este arquivo já se chamou
# `docker-compose.override.yml` — nome que o Docker Compose mescla
# AUTOMATICAMENTE com `docker-compose.yml` em qualquer `docker compose up`
# rodado neste diretório, inclusive em desenvolvimento local (não só na
# VPS), removendo sem querer o atalho de portas publicadas que todo mundo
# usa pra rodar localmente sem Docker Desktop exposto. Renomeado pra
# `docker-compose.prod.yml`, que NÃO é aplicado automaticamente — a VPS
# passa `-f` explícito (ver `DEPLOY.md`).
services:
  postgres:
    ports: !reset []
  redis:
    ports: !reset []
  api:
    ports: !reset []
  web:
    ports: !reset []
